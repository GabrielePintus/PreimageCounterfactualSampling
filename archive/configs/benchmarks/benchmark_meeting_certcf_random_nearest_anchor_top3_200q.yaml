seed: 42
output: results/benchmark_meeting_certcf_random_nearest_anchor_top3_200q.parquet
timeout_per_sample: 120

# ---------------------------------------------------------------------------
# CertCF random-anchor nearest-anchor benchmark.
#
# This is the minimal version of the approximate query idea:
# - build one random-anchor atlas with k_per_class=2000
# - at query time, retrieve the L nearest target-class anchors
# - solve projection only on those L certified polytopes
# - return the best projected point
#
# This does not compare against full search in the same run. That is deliberate:
# the benchmark framework builds one atlas per method run, so adding many query
# variants repeats the atlas build cost and makes the run feel much slower than
# the actual top-3 query strategy.
# ---------------------------------------------------------------------------
methods:

  - name: certcf
    run_name: certcf_input_random_topL_anchor
    params:
      device: cuda
      norm: 1
      distance_norm: 1
      eps_alpha: 0.45
      batch_size: 256
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: 2000
      query_method: nearest_anchor
      query_k_candidates: [3, 5]

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [32, 8]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1
