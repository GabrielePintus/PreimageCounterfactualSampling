seed: 42
output: results/benchmark_meeting_certcf_random_nearest_anchor_query_200q.parquet
timeout_per_sample: 120

# ---------------------------------------------------------------------------
# CertCF random-anchor query-strategy benchmark.
#
# Purpose:
# - Keep the scalable random anchor atlas from the k-sweep experiment.
# - Fix k_per_class=2000, where random anchors gave the strongest proximity
#   gains on adult/compas.
# - Compare the current full sorted lower-bound search against the new
#   fixed-budget nearest-anchor query strategy.
#
# Interpretation:
# - certcf_input_random_full_sorted is the current full atlas search baseline.
# - certcf_input_random_topL_anchor projects only onto the top-L nearest
#   target-class anchors, so query QP count should be approximately L.
# - Returned counterfactuals remain certified because projection is still
#   performed against certified target-class polytopes.
# - The nearest-anchor strategy is approximate: it does not guarantee the
#   closest point over the full atlas.
# ---------------------------------------------------------------------------
methods:

  - name: certcf
    run_name: certcf_input_random_full_sorted
    params:
      device: cuda
      norm: 1
      distance_norm: 1
      eps_alpha: 0.45
      batch_size: 256
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: 2000
      query_method: sorted

  - name: certcf
    run_name: certcf_input_random_topL_anchor
    params:
      device: cuda
      norm: 1
      distance_norm: 1
      eps_alpha: 0.45
      batch_size: 256
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: 2000
      query_method: nearest_anchor
      query_k_candidates: [1, 3, 5, 10, 20, 50]

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [32, 8]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1
