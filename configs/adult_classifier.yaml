trainer:
  max_epochs: 50
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/adult_classifier/
      filename: "Adult-Classifier-{epoch:03d}-{val/loss:.4f}"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: true
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "Adult-Classifier"
      log_model: true

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.TabularClassifier
      init_args:
        # Column order: age, workclass, fnlwgt, education, education-num, marital-status,
        #               occupation, relationship, race, sex, capital-gain, capital-loss,
        #               hours-per-week, native-country
        input_types:
          - numerical    # age
          - categorical  # workclass
          - numerical    # fnlwgt
          - categorical  # education
          - numerical    # education-num
          - categorical  # marital-status
          - categorical  # occupation
          - categorical  # relationship
          - categorical  # race
          - categorical  # sex
          - numerical    # capital-gain
          - numerical    # capital-loss
          - numerical    # hours-per-week
          - categorical  # native-country
        cardinalities: [9, 16, 7, 15, 6, 5, 2, 42]  # per categorical column, in order
        embedding_dim: 1
        hidden_dims: [64, 32]
        num_classes: 2

    initial_lr: 1e-3
    final_lr: 1e-6
    weight_decay: 1e-4
    warmup_steps: 200

data:
  class_path: training.datamodules.adult.AdultDataModule
  init_args:
    data_dir: data/
    batch_size: 256
    val_fraction: 0.1
    test_fraction: 0.1
    seed: 42
    num_workers: 4
