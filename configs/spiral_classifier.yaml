trainer:
  max_epochs: 200
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/spiral_classifier/
      filename: "Spiral-Classifier-{epoch:03d}-{val/loss:.4f}"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: true
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "Spiral-Classifier"
      log_model: true

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.SimpleClassifier
      init_args:
        input_dim: 2
        hidden_dims: [64, 32]
        num_classes: 10
    initial_lr: 1e-2
    final_lr: 1e-6
    weight_decay: 1e-4
    warmup_steps: 50

data:
  class_path: training.datamodules.spiral.SpiralDataModule
  init_args:
    n_samples_per_class: 300
    n_classes: 10
    noise: 0.1
    seed: 42
    val_fraction: 0.1
    test_fraction: 0.1
    batch_size: 64
    num_workers: 0
