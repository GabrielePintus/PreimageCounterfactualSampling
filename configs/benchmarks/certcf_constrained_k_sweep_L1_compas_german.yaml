seed: 42
output: results/benchmark_certcf_constrained_k_sweep_L1_compas_german.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0

sampling:
  n_queries: 200
  n_train_per_class: 10000

methods:
  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1

  - name: certcf
    run_name: certcf_nn_init_constrained
    params:
      device: cuda
      norm: 1
      eps_alpha: 0.10
      classification_margin: 1.0e-4
      adaptive_eps: true
      adaptive_eps_shrink_factor: 0.5
      adaptive_eps_max_shrinks: 10
      adaptive_eps_min: 1.0e-6
      adaptive_eps_center_tol: 1.0e-6
      adaptive_eps_binary_search_steps: 0
      batch_size: 256
      query_method: nearest_anchor
      query_k_candidates: 100
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: null
      cvxpy_solvers: [CLARABEL]
      cvxpy_solver_options:
        CLARABEL:
          max_iter: 100
          tol_gap_abs: 1.0e-3
          tol_gap_rel: 1.0e-5
          tol_feas: 1.0e-8
      cvxpy_accept_statuses:
        CLARABEL: [optimal]
      ohe_decode_mode: beam_then_exact
      decode_beam_width: 8
      decode_beam_branch_top_k: 3
      decode_beam_max_solver_calls: 32

datasets:
  - name: compas
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      nn:
        immutable_features: [sex, race]
        nondecreasing_features: [age]
      certcf_nn_init_constrained:
        immutable_features: [sex, race]
        nondecreasing_features: [age]

  - name: german_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      certcf_nn_init_constrained:
        immutable_features: [personal_status, foreign_worker]
