seed: 42
output: results/benchmark_certcf_alpha_ablation_compas_probe.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: false
sampling:
  n_queries: 200
  n_train_per_class: 10000
methods:
- name: certcf
  run_name: certcf_alpha_ablation
  params:
    device: auto
    lirpa_method: backward
    norm: 1
    distance_norm: 1
    eps_alpha:
    - 0.05
    - 0.1
    - 0.15
    - 0.25
    - 0.45
    classification_margin: 0.0001
    batch_size: 128
    query_method: nearest_anchor
    query_k_candidates: 5
    atlas_subsample_method: random
    atlas_subsample_space: input
    k_per_class: 10000
    cvxpy_solvers:
    - CLARABEL
    cvxpy_solver_options:
      CLARABEL:
        max_iter: 100
        tol_gap_abs: 0.001
        tol_gap_rel: 1.0e-05
        tol_feas: 1.0e-08
    cvxpy_accept_statuses:
      CLARABEL:
      - optimal
    ohe_decode_mode: beam_then_exact
    decode_beam_width: 8
    decode_beam_branch_top_k: 3
    decode_beam_max_solver_calls: 32
datasets:
- name: compas
  model:
    name: tabular_classifier_ckpt
    params:
      checkpoint: checkpoints/compas_classifier/best.ckpt
      device: auto
      dataset_module: compas
      hidden_dims:
      - 64
      - 32
      dropout: 0.2
