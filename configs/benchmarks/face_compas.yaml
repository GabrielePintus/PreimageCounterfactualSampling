seed: 42
resource_monitor:
  enabled: true
  interval_s: 1.0

dataset:
  name: compas

model:
  name: tabular_classifier_ckpt
  params:
    checkpoint: checkpoints/compas_classifier/best.ckpt
    device: cuda
    dataset_module: compas
    hidden_dims: [64, 32]
    dropout: 0.2

sampling:
  n_queries: 1000

timeout_per_sample: 120

output:
  path: results/benchmark_face_compas.parquet

methods:
  - name: face
    run_name: face
    params:
      density_estimator:
        # name: kde
        name: knn
      norm: 1
      tp: 0.5
      epsilon: 1.5
