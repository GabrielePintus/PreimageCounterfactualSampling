seed: 42

dataset:
  name: mnist
  params:
    data_dir: data/

model:
  name: mnist_classifier_ckpt
  params:
    checkpoint: checkpoints/mnist_classifier/best.ckpt
    device: cuda
    num_classes: 10

sampling:
  balanced_per_class: 1
  target_policy: all_other_classes

timeout_per_sample: 60

output:
  path: results/benchmark_mnist.parquet

methods:

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1
      subsample_method: kmedoids
      k_per_class: 200

  - name: dice
    run_name: dice
    params:
      total_cfs: 1
      diversity_weight: 0.0
      proximity_weight: 1.0
      min_iter: 50
      max_iter: 500
      posthoc_sparsity_param: 0.0

  - name: growing_spheres
    run_name: gs
    params:
      max_radius: 6.0
      radius_step: 0.2
      n_in_layer: 1024

  - name: face
    run_name: face
    params:
      density_estimator:
        name: knn
        n_neighbors: 10
      tp: 0.5
      epsilon: 6.0
      subsample_method: kmedoids
      k_per_class: 200

  - name: cpp
    run_name: cpp
    params:
      checkpoint: checkpoints/mnist_classifier/best.ckpt
      device: cuda
      norm: 2
      eps_alpha: 0.1
      batch_size: 64
      solver_maxiter: 1000
      subsample_method: kmedoids
      k_per_class: 200
