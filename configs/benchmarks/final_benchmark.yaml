seed: 42
output: results/final_benchmark.parquet
timeout_per_sample: 120

resource_monitor:
  enabled: true
  interval_s: 1.0

sampling:
  n_queries: 1000
  n_train_per_class: 10000

methods:
  - name: certcf
    run_name: certcf_backward_shrink_sparsity_eps_alpha=0.2-sparsity_lambda=1.0
    params:
      device: auto
      lirpa_method: backward
      norm: 1
      distance_norm: 1
      eps_alpha: 0.20
      classification_margin: 1.0e-4
      adaptive_eps: true
      adaptive_eps_shrink_factor: 0.5
      adaptive_eps_max_shrinks: 8
      adaptive_eps_min: 1.0e-6
      adaptive_eps_center_tol: 1.0e-6
      adaptive_eps_binary_search_steps: 0
      sparsity_penalty: reweighted_l1
      sparsity_lambda: 1.0
      sparsity_reweight_iters: 2
      sparsity_eps: 1.0e-3
      sparsity_group_ohe: true
      batch_size: 128
      # Paper protocol: sample 500 atlas anchors per predicted class at random.
      # Keep these values explicit so future runner defaults cannot change the
      # experiment silently.
      k_per_class: 500
      atlas_subsample_method: random
      query_method: nearest_anchor
      query_k_candidates: 5
      cvxpy_solvers: [CLARABEL]
      cvxpy_solver_options:
        CLARABEL:
          max_iter: 100
          tol_gap_abs: 1.0e-3
          tol_gap_rel: 1.0e-5
          tol_feas: 1.0e-8
      cvxpy_accept_statuses:
        CLARABEL: [optimal]
      ohe_decode_mode: beam_then_exact
      decode_beam_width: 8
      decode_beam_branch_top_k: 3
      decode_beam_max_solver_calls: 32

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1

  - name: growing_spheres
    run_name: growing_spheres
    params:
      norm: 1
      max_radius: 50.0
      radius_step: 0.25
      n_in_layer: 1000

  - name: dice
    run_name: dice
    params:
      total_cfs: 1
      diversity_weight: 0.0
      proximity_weight: 1.0
      min_iter: 50
      max_iter: 500
      query_batch_size: 1

  - name: face
    run_name: face
    params:
      density_estimator:
        name: knn
      norm: 2
      tp: 0.5

datasets:
  - name: adult
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: auto
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 2.9

  - name: compas
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: auto
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 1.5

  - name: german_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: auto
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 3.6

  - name: give_me_some_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: auto
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 1.1

  - name: heloc
    dataset_params: {}
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/heloc_classifier/best.ckpt
        device: auto
        dataset_module: heloc
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 3.3

  - name: lending_club
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/lending_club_classifier/best.ckpt
        device: auto
        dataset_module: lending_club
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 2.6

  - name: wisconsin_breast_cancer
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: auto
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 4.5
