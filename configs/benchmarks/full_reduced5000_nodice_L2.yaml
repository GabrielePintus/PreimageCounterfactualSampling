seed: 42
output: results/benchmark_full_reduced5000_nodice_L2.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0


methods:

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 2

  - name: growing_spheres
    run_name: gs
    params:
      norm: 2
      max_radius: 10.0
      radius_step: 0.25
      n_in_layer: 1000

  - name: dice
    run_name: dice
    params:
      total_cfs: 1
      diversity_weight: 0.0
      proximity_weight: 1.0
      min_iter: 50
      max_iter: 500
      query_batch_size: 250

  - name: certcf
    run_name: certcf
    params:
      device: cuda
      norm: 2
      eps_alpha: [0.25, 0.45, 0.65, 0.85, 0.99]
      batch_size: 256
      query_method: nearest_anchor
      query_k_candidates: 3
      atlas_subsample_method: boundary_random
      atlas_boundary_beta: 0.5
      atlas_subsample_space: input
      k_per_class: 5000

datasets:

  - name: wisconsin_breast_cancer
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: cuda
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: adult
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
