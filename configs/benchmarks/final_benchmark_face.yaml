seed: 42
output: results/final_benchmark_face.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0

sampling:
  n_train_per_class: 10000
  n_queries: 1000

methods:
  - name: face
    run_name: face
    params:
      density_estimator:
        name: knn
      norm: 2
      tp: 0.5

datasets:
  - name: adult
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 2.9

  - name: compas
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 1.5

  - name: german_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 3.6

  - name: give_me_some_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: cuda
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 1.1

  - name: heloc
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/heloc_classifier/best.ckpt
        device: cuda
        dataset_module: heloc
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 3.3

  - name: lending_club
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/lending_club_classifier/best.ckpt
        device: cuda
        dataset_module: lending_club
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 2.6

  - name: wisconsin_breast_cancer
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: cuda
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      face:
        epsilon: 4.5
