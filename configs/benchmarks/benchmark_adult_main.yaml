seed: 42

dataset:
  name: adult
  params:
    data_dir: data/

model:
  name: tabular_classifier_ckpt
  params:
    checkpoint: checkpoints/adult_classifier/best.ckpt
    device: cuda

sampling:
  # n_queries: 500
  n_queries: 20         # number of test queries (same set used by all methods)

timeout_per_sample: 120   # seconds per (method, query)

output:
  path: results/benchmark_adult_main.parquet

methods:

  # --- Nearest Neighbor (lower-bound baseline) ---
  # Grid: norm
  - name: nearest_neighbor
    run_name: nn
    params:
      norm: [1, 2]

  # # --- Wachter ---
  # # Grid: n_restarts
  # - name: wachter
  #   run_name: wachter
  #   params:
  #     n_restarts: [1, 3]

  # --- Growing Spheres ---
  # Grid: radius_step (fix n_in_layer=512, max_radius=5.0)
  - name: growing_spheres
    run_name: growing_spheres
    params:
      n_in_layer: 512
      max_radius: 5.0
      radius_step: [0.05, 0.15, 0.30]

  # # --- DiCE ---
  # # Grid: proximity_weight (fix total_cfs=4, diversity_weight=1.0)
  # - name: dice
  #   run_name: dice
  #   params:
  #     total_cfs: 4
  #     diversity_weight: 0.0
  #     min_iter: 500
  #     max_iter: 5000
  #     proximity_weight: [0.5, 1.0, 2.0]

  # --- FACE ---
  # Grid: epsilon (connectivity radius; fix tp=0.5, k_per_class=1000)
  - name: face
    run_name: face
    params:
      density_estimator:
        name: kde
      tp: 0.5
      k_per_class: 1000
      subsample_method: kmedoids
      epsilon: [1.0, 2.0]

  # --- Certified Preimage Counterfactuals (CPP) ---
  # Grid: eps_alpha x k_per_class (fix norm=1, batch_size=256)
  - name: cpp
    run_name: cpp
    params:
      checkpoint: checkpoints/adult_classifier/best.ckpt
      device: cuda
      norm: [1, 2]
      batch_size: 256
      eps_alpha: [0.15, 0.25, 0.35, 0.45]
      k_per_class: [50, 100, 200, 500]
