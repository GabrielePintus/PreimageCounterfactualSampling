seed: 42
output: results/benchmark_nn_reduced10000_L1.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0

methods:
  - name: nearest_neighbor
    run_name: nn_k10000
    params:
      norm: 1
      k_per_class: 10000
      subsample_method: random

datasets:
  - name: wisconsin_breast_cancer
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: cuda
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: adult
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: compas
