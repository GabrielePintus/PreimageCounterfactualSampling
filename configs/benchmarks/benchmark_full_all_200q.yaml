seed: 42
output: results/benchmark_full_all_200q.parquet
timeout_per_sample: 120

# ---------------------------------------------------------------------------
# Full paper-facing benchmark.
#
# Purpose:
# - Compare every currently supported tabular benchmark method in one run.
# - Use a fixed 200-query budget per dataset.
# - Include the full active tabular dataset surface, including Wisconsin Breast
#   Cancer once its classifier checkpoint is available.
#
# Notes:
# - CertCF inherits its checkpoint automatically from each dataset model block.
# - Benchmark fit is prediction-aligned for all methods.
# - Model-driven methods (e.g. DiCE, Wachter, Growing Spheres, FACE) inherit
#   their execution device from each dataset model block below. Keep those
#   model devices on `cuda` when GPU execution is desired.
# - Only set a method-level `device` when the method explicitly supports it
#   (e.g. CertCF).
# - Avoid clustering-based subsampling. Where support reduction is needed for
#   scalability, use lightweight random/boundary-random policies instead.
# - This config assumes all referenced checkpoints exist.
# ---------------------------------------------------------------------------
methods:

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1

  - name: growing_spheres
    run_name: gs
    params:
      max_radius: 5.0
      radius_step: 0.15
      n_in_layer: 512

  - name: certcf
    run_name: certcf
    params:
      device: cuda
      norm: 1
      eps_alpha: 0.45
      batch_size: 256
      atlas_subsample_method: boundary_random
      atlas_boundary_beta: 0.5
      atlas_subsample_space: input
      k_per_class: 5000

datasets:

  - name: wisconsin_breast_cancer
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: cuda
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [32, 8]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: heloc
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/heloc_classifier/best.ckpt
        device: cuda
        dataset_module: heloc
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: give_me_some_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: cuda
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: lending_club
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/lending_club_classifier/best.ckpt
        device: cuda
        dataset_module: lending_club
        hidden_dims: [64, 32]
        dropout: 0.1


