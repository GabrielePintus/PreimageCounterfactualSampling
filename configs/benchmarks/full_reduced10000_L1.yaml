seed: 42
output: results/benchmark_full_reduced10000_L1.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0


methods:

  - name: certcf
    run_name: certcf
    params:
      device: cuda
      norm: 1
      eps_alpha: [0.25, 0.45, 0.65, 0.85, 0.99]
      classification_margin: 1.0e-4
      batch_size: 256
      query_method: nearest_anchor
      query_k_candidates: 5
      atlas_subsample_method: boundary_random
      atlas_boundary_beta: 0.5
      atlas_subsample_space: input
      k_per_class: 10000
      cvxpy_solvers: [CLARABEL]
      cvxpy_solver_options:
        CLARABEL:
          max_iter: 100
          tol_gap_abs: 1.0e-3
          tol_gap_rel: 1.0e-5
          tol_feas: 1.0e-8
      cvxpy_accept_statuses:
        CLARABEL: [optimal]
      ohe_decode_mode: beam_then_exact
      decode_beam_width: 8
      decode_beam_branch_top_k: 3
      decode_beam_max_solver_calls: 32

datasets:

  - name: wisconsin_breast_cancer
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/wisconsin_breast_cancer_classifier/best.ckpt
        device: cuda
        dataset_module: wisconsin_breast_cancer
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: adult
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: german_credit
    sampling:
