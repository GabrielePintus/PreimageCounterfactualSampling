seed: 42
resource_monitor:
  enabled: true
  interval_s: 1.0

dataset:
  name: lending_club

model:
  name: tabular_classifier_ckpt
  params:
    checkpoint: checkpoints/lending_club_classifier/best.ckpt
    device: cuda
    dataset_module: lending_club
    hidden_dims: [64, 32]
    dropout: 0.2

sampling:
  n_train: 5000
  n_queries: 1000

timeout_per_sample: 120

output:
  path: results/benchmark_face_lending_club.parquet

methods:
  - name: face
    run_name: face
    params:
      density_estimator:
        name: knn
      norm: 2
      tp: 0.5
      epsilon: 2.6
