seed: 42
output: results/benchmark_meeting_certcf_input_vs_latent_200q_alpha05.parquet
timeout_per_sample: 60   # seconds per (method, query)

# ---------------------------------------------------------------------------
# CertCF-only comparison: input-space vs latent-space atlas subsampling.
# Checkpoint is auto-inherited from each dataset's model.params.checkpoint.
# ---------------------------------------------------------------------------
methods:

  - name: certcf
    run_name: certcf_input_kmedoids
    params:
      device: cuda
      norm: 1
      eps_alpha: 0.5
      batch_size: 256
      atlas_subsample_method: kmedoids
      atlas_subsample_space: input
      k_per_class: 500

  - name: certcf
    run_name: certcf_latent_kmedoids
    params:
      device: cuda
      norm: 1
      eps_alpha: 0.5
      batch_size: 256
      atlas_subsample_method: kmedoids
      atlas_subsample_space: latent
      k_per_class: 500

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [32, 8]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1

