seed: 42
output: results/benchmark_meeting_certcf_boundary_random_top3_plus_nn_gs_200q.parquet
timeout_per_sample: 120

# ---------------------------------------------------------------------------
# Same datasets as the boundary-random top-L CertCF benchmark, plus:
# - nearest_neighbor
# - growing_spheres
# - dice
# ---------------------------------------------------------------------------
methods:

  - name: certcf
    run_name: certcf_input_boundary_random_topL_anchor
    params:
      device: cuda
      norm: 1
      distance_norm: 1
      eps_alpha: 0.45
      batch_size: 256
      atlas_subsample_method: boundary_random
      atlas_boundary_beta: 0.5
      atlas_subsample_space: input
      k_per_class: 10000
      query_method: nearest_anchor
      query_k_candidates: 3

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1

  - name: dice
    run_name: dice
    params:
      total_cfs: 1
      proximity_weight: 1.0
      diversity_weight: 0.0
      min_iter: 50
      max_iter: 500
      posthoc_sparsity_param: 0.0

  - name: growing_spheres
    run_name: gs
    params:
      max_radius: 5.0
      radius_step: 0.15
      n_in_layer: 512

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [32, 8]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1
