seed: 42
output: results/certcf_probe_single_dataset.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: false
sampling:
  n_queries: 25

methods:
  - name: nearest_neighbor
    run_name: nn_probe
    params:
      norm: 1
      k_per_class: 1000
      subsample_method: random
  
  - name: certcf
    run_name: certcf_backward
    params:
      device: auto
      lirpa_method: backward
      norm: 1
      distance_norm: 1
      eps_alpha: 0.15
      classification_margin: 1.0e-4
      batch_size: 128
      # query_method: sorted
      query_method: nearest_anchor
      query_k_candidates: 5
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: 1000
      cvxpy_solvers: [CLARABEL]
      cvxpy_solver_options:
        CLARABEL:
          max_iter: 100
          tol_gap_abs: 1.0e-3
          tol_gap_rel: 1.0e-5
          tol_feas: 1.0e-8
      cvxpy_accept_statuses:
        CLARABEL: [optimal]
      ohe_decode_mode: beam_then_exact
      decode_beam_width: 8
      decode_beam_branch_top_k: 3
      decode_beam_max_solver_calls: 32

datasets:
  - name: give_me_some_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: auto
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: adult
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: compas
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: auto
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: heloc
    dataset_params: {}
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/heloc_classifier/best.ckpt
        device: auto
        dataset_module: heloc
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: lending_club
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/lending_club_classifier/best.ckpt
        device: auto
        dataset_module: lending_club
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: german_credit
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: auto
        dataset_module: german_credit
