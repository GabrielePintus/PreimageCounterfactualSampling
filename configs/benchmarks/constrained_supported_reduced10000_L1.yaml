seed: 42
output: results/benchmark_constrained_supported_reduced10000_L1.parquet
timeout_per_sample: 120
resource_monitor:
  enabled: true
  interval_s: 1.0

methods:
  - name: certcf
    run_name: certcf_nn_init_10k_constrained
    params:
      device: cuda
      norm: 1
      eps_alpha: 0.25
      classification_margin: 1.0e-4
      batch_size: 256
      query_method: nearest_anchor
      query_k_candidates: 5
      atlas_subsample_method: random
      atlas_subsample_space: input
      k_per_class: 10000
      cvxpy_solvers: [CLARABEL]
      cvxpy_solver_options:
        CLARABEL:
          max_iter: 100
          tol_gap_abs: 1.0e-3
          tol_gap_rel: 1.0e-5
          tol_feas: 1.0e-8
      cvxpy_accept_statuses:
        CLARABEL: [optimal]
      ohe_decode_mode: beam_then_exact
      decode_beam_width: 8
      decode_beam_branch_top_k: 3
      decode_beam_max_solver_calls: 32

  - name: nearest_neighbor
    run_name: nn_10k_constrained
    params:
      norm: 1
      k_per_class: 10000
      subsample_method: random

  - name: growing_spheres
    run_name: gs_constrained
    params:
      norm: 1
      max_radius: 10.0
      radius_step: 0.25
      n_in_layer: 1000

datasets:
  - name: adult
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      certcf_nn_init_10k_constrained:
        immutable_features: [sex, race, native-country]
      nn_10k_constrained:
        immutable_features: [sex, race, native-country]
      gs_constrained:
        immutable_features: [sex, race, native-country]

  - name: compas
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      certcf_nn_init_10k_constrained:
        immutable_features: [sex, race]
        nondecreasing_features: [age]
      nn_10k_constrained:
        immutable_features: [sex, race]
        nondecreasing_features: [age]
      gs_constrained:
        immutable_features: [sex, race]
        nondecreasing_features: [age]

  - name: german_credit
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      certcf_nn_init_10k_constrained:
        immutable_features: [age, personal_status, foreign_worker]
      nn_10k_constrained:
        immutable_features: [age, personal_status, foreign_worker]
      gs_constrained:
        immutable_features: [age, personal_status, foreign_worker]

  - name: give_me_some_credit
    sampling:
      n_queries: 1000
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: cuda
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.2
    method_overrides:
      certcf_nn_init_10k_constrained:
        immutable_features: [age]
      nn_10k_constrained:
        immutable_features: [age]
      gs_constrained:
        immutable_features: [age]
