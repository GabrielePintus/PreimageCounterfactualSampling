seed: 42
output: results/benchmark_meeting_all_200q.parquet
timeout_per_sample: 60   # seconds per (method, query)

# ---------------------------------------------------------------------------
# Shared methods — applied to every dataset below.
# certcf.checkpoint is auto-inherited from each dataset's model.params.checkpoint.
# Use dataset.method_overrides to change individual params for a specific dataset.
# ---------------------------------------------------------------------------
methods:

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1
      subsample_method: kmedoids
      k_per_class: 200

  - name: dice
    run_name: dice
    params:
      total_cfs: 1
      diversity_weight: 0.0
      proximity_weight: 1.0
      min_iter: 50

  - name: growing_spheres
    run_name: gs
    params:
      max_radius: 5.0
      radius_step: 0.15
      n_in_layer: 512

  - name: face
    run_name: face
    params:
      density_estimator:
        name: kde
      tp: 0.5
      epsilon: 2.0
      subsample_method: kmedoids
      k_per_class: 200

  - name: certcf
    run_name: certcf
    params:
      # checkpoint is auto-inherited from model.params.checkpoint
      device: cuda
      norm: 1
      eps_alpha: 0.25
      batch_size: 256
      subsample_method: kmedoids
      k_per_class: 200

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: adult
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/adult_classifier/best.ckpt
        device: cuda
        dataset_module: adult
        hidden_dims: [64, 32]
        dropout: 0.2

  - name: compas
    sampling:
      n_queries: 200
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
