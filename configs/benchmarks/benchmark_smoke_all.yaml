seed: 42
output: results/benchmark_smoke_all.parquet
timeout_per_sample: 60   # seconds per (method, query)

# ---------------------------------------------------------------------------
# Shared methods — applied to every dataset below.
# certcf.checkpoint is auto-inherited from each dataset's model.params.checkpoint.
# Use dataset.method_overrides to override individual params per dataset.
# ---------------------------------------------------------------------------
methods:

  - name: nearest_neighbor
    run_name: nn
    params:
      norm: 1

  - name: growing_spheres
    run_name: gs
    params:
      max_radius: 5.0
      radius_step: 0.15
      n_in_layer: 512

  - name: certcf
    run_name: certcf
    params:
      # checkpoint is auto-inherited from model.params.checkpoint
      device: cuda
      norm: 1
      eps_alpha: 0.25
      batch_size: 256
      subsample_method: kmedoids
      k_per_class: 200

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - name: compas
    sampling:
      n_queries: 50
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/compas_classifier/best.ckpt
        device: cuda
        dataset_module: compas
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: german_credit
    sampling:
      n_queries: 50
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/german_credit_classifier/best.ckpt
        device: cuda
        dataset_module: german_credit
        hidden_dims: [64, 32]
        dropout: 0.1

  - name: heloc
    sampling:
      n_queries: 50
    dataset_params: {}      # heloc does not require data_dir
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/heloc_classifier/best.ckpt
        device: cuda
        dataset_module: heloc
        hidden_dims: [64, 32]
        dropout: 0.1
    method_overrides:
      certcf:
        eps_alpha: 0.35     # heloc needs a slightly larger margin

  - name: give_me_some_credit
    sampling:
      n_queries: 50
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/give_me_some_credit_classifier/best.ckpt
        device: cuda
        dataset_module: give_me_some_credit
        hidden_dims: [64, 32]
        dropout: 0.1
    method_overrides:
      certcf:
        batch_size: 16      # smaller batch to avoid OOM on this dataset
        k_per_class: 100

  - name: lending_club
    sampling:
      n_queries: 50
    model:
      name: tabular_classifier_ckpt
      params:
        checkpoint: checkpoints/lending_club_classifier/best.ckpt
        device: cuda
        dataset_module: lending_club
        hidden_dims: [64, 32]
        dropout: 0.1
