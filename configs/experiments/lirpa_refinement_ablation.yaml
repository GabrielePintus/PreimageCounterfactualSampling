# Official ablation of LiRPA refinement inside Eq. (1) anchor neighborhoods.
experiment:
  seed: 42
  require_cuda: true
  source_grid_config: configs/experiments/network_complexity_grid.yaml
  cases:
    - {id: heloc, kind: tabular, dataset: heloc}
    - {id: adult, kind: tabular, dataset: adult}
    - {id: depth_01_width_128, kind: synthetic32, depth: 1, width: 128}
    - {id: depth_02_width_128, kind: synthetic32, depth: 2, width: 128}
    - {id: depth_03_width_128, kind: synthetic32, depth: 3, width: 128}
    - {id: depth_04_width_128, kind: synthetic32, depth: 4, width: 128}
    - {id: depth_05_width_128, kind: synthetic32, depth: 5, width: 128}

data:
  data_dir: data
  queries_per_case: 500
  tabular_support_per_true_class: 10000
  synthetic_support_total: 10000
  anchors_per_predicted_class: 500
  eps_alpha: 0.20
  eps_reference_chunk_size: 128

retrieval:
  tabular_top_k: 5
  synthetic_top_k: 3

constraints:
  immutable_features:
    adult: [sex]

anchor_ball:
  cvxpy_solvers: [CLARABEL]
  solver_options:
    CLARABEL: {max_iter: 100, tol_gap_abs: 1.0e-3, tol_gap_rel: 1.0e-5, tol_feas: 1.0e-8}
  accept_statuses:
    CLARABEL: [optimal]
  beam_width: 8
  beam_branch_top_k: 3
  beam_max_solver_calls: 32

anchor_pgd:
  lambda_schedule: [0.1, 1.0, 10.0, 100.0, 1000.0]
  steps_per_lambda: 200
  restarts: 3
  classification_margin: 1.0e-4
  projection_iterations: 50
  projection_tolerance: 1.0e-6
  learning_rate_scale: 0.25
  learning_rate_min: 1.0e-3
  learning_rate_final_fraction: 0.01

certcf:
  device: auto
  lirpa_method: backward
  lirpa_batch_size: 128
  classification_margin: 1.0e-4
  adaptive_eps: true
  adaptive_eps_shrink_factor: 0.5
  adaptive_eps_max_shrinks: 8
  adaptive_eps_min: 1.0e-6
  adaptive_eps_center_tol: 1.0e-6
  adaptive_eps_binary_search_steps: 0
  solver_maxiter: 500
  cvxpy_solvers: [CLARABEL]
  cvxpy_solver_options:
    CLARABEL: {max_iter: 100, tol_gap_abs: 1.0e-3, tol_gap_rel: 1.0e-5, tol_feas: 1.0e-8}
  cvxpy_accept_statuses:
    CLARABEL: [optimal]

runtime:
  timeout_seconds_per_query: 120
  rss_sample_interval_seconds: 0.05

analysis:
  empirical_sigmas: [0.0, 0.01, 0.03, 0.05, 0.10]
  empirical_samples_per_sigma: 10
  certified_l1_maximum: 5.0
  certified_l1_steps: 14
  lof_neighbors: 20
  isolation_forest_estimators: 200

pilot:
  queries_per_case: 50
  cases: [heloc, adult, depth_01_width_128, depth_05_width_128]

artifacts:
  output_dir: results/lirpa_refinement_ablation
