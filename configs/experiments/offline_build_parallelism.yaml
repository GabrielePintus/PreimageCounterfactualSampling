# Controlled pilot for the final CertCF offline implementation.
# Each case/variant is executed in a fresh process by the dedicated CLI.
source_configs:
  lirpa_ablation: configs/experiments/lirpa_refinement_ablation.yaml
  network_complexity: configs/experiments/network_complexity_grid.yaml
  cifar_scaling: configs/experiments/cifar_resnet_scaling.yaml

cases:
  heloc:
    kind: lirpa_ablation
    source_case: heloc
  fcnn_depth05_width256:
    kind: network_complexity
    depth: 5
    width: 256
  cifar_resnet20:
    kind: cifar_scaling
    network: resnet20
  cifar_resnet32:
    kind: cifar_scaling
    network: resnet32
    reference_atlas: results/cifar_resnet_scaling/networks/resnet32/atlas
  cifar_resnet56:
    kind: cifar_scaling
    network: resnet56
    reference_atlas: results/cifar_resnet_scaling/networks/resnet56/atlas

variants:
  serial:
    epsilon_parallelism: 1
    build_parallelism: 1
  epsilon8:
    epsilon_parallelism: 8
    build_parallelism: 1
  lirpa2:
    epsilon_parallelism: 1
    build_parallelism: 2
  combined:
    epsilon_parallelism: 8
    build_parallelism: 2
  cnn_batch64:
    cases: [cifar_resnet20]
    epsilon_parallelism: 8
    build_parallelism: 1
    cnn_radius_batch_size: 64
    cnn_radius_batch_max_relative_inflation: 0.05

comparison:
  absolute_tolerance: 1.0e-6
  relative_tolerance: 1.0e-6
  chunk_elements: 1000000

# Full optimized offline rerun for the 25-cell synthetic FCNN scaling grid.
# Historical serial and parallel-query summaries remain immutable inputs.
fcnn_grid:
  optimized:
    epsilon_parallelism: 8
    build_parallelism: 1
    lirpa_batch_size: 512
  serial_summary: results/network_complexity/archive/serial_before_parallel_2026-09-05/network_complexity_summary.parquet
  parallel_summary: results/network_complexity/network_complexity_summary.parquet

artifacts:
  output_dir: results/offline_build_parallelism
