  # --- FACE (KDE density, Eq. 2) ---
  # Grid: epsilon x bandwidth x k_per_class x tp
  # - name: face
  #   run_name: face_kde
  #   params:
  #     density_estimator:
  #       name: kde
  #       params:
  #         epsilon: [0.5, 0.75, 1.0]
  #         bandwidth: [0.3, 0.5, 1.0]
  #     td: 0.0
  #     tp: [0.5, 0.55, 0.6]
  #     subsample_method: kmedoids
  #     k_per_class: [2000, 10000]

  - name: face
    run_name: face_knn
    params:
      density_estimator:
        name: kde
      epsilon: 3.0        # prunes long-range kNN edges
      # td: 0.0           # no density threshold
      # tp: 0.5
      subsample_method: kmeans
      k_per_class: 1000

