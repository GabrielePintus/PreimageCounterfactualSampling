seed: 42

dataset:
  name: adult
  params:
    data_dir: data/

preprocessing:
  name: pca
  params:
    n_components: 0.99
    svd_solver: full
    whiten: false
    random_state: 42


model:
  name: tabular_classifier_ckpt
  params:
    checkpoint: checkpoints/adult_classifier/best.ckpt
    device: cpu

sampling:
  n_queries: 1000         # number of test queries (same set used by all methods)

timeout_per_sample: 60   # seconds per (method, query); set to 0 to disable

output:
  path: results/benchmark_adult_4.parquet

methods:

  # # --- Nearest Neighbor (no hyperparameters) ---
