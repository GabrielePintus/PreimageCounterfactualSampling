seed: 42

dataset:
  name: adult
  params:
    data_dir: data/

sampling:
  n_train: 5000
  n_queries: 200
  train_method: kmedoids

atlas:
  params:
    checkpoint: checkpoints/adult_classifier/best.ckpt
    device: cpu
    eps_alpha: 0.25
    k_per_class: null
    max_samples_per_class: null
    norm: 2
    batch_size: 256
    cvxpy_solver_policy: legacy

variants:
  - name: sorted_l2_legacy
    method: sorted
    params:
      delta: 0.0

output:
  per_query_path: results/cpp_query_benchmark_adult_l2_ablation_legacy.parquet
  summary_path: results/cpp_query_benchmark_adult_l2_ablation_legacy_summary.parquet
  report_md_path: results/cpp_query_benchmark_adult_l2_ablation_legacy_summary.md
