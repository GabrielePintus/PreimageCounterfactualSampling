seed: 42

dataset:
  name: adult
  params:
    data_dir: data/

sampling:
  n_train: 1000
  n_queries: 40
  train_method: random

atlas:
  params:
    checkpoint: checkpoints/adult_classifier/best.ckpt
    device: cpu
    eps_alpha: 0.25
    k_per_class: null
    max_samples_per_class: null
    norm: 1
    batch_size: 128

variants:
  - name: bvh
    method: bvh
    params:
      delta: 0.0

  - name: sorted
    method: sorted
    params:
      delta: 0.0


output:
  per_query_path: results/cpp_query_benchmark_adult_smoke.parquet
  summary_path: results/cpp_query_benchmark_adult_smoke_summary.parquet
  report_md_path: results/cpp_query_benchmark_adult_smoke_summary.md
