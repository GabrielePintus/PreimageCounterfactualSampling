trainer:
  max_epochs: 100
  accelerator: gpu
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: preimage-sampling
      save_dir: logs/
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/autoencoder/
      filename: "MNIST-Autoencoder-{epoch:03d}-{val/loss:.4f}"
      monitor: val/loss
      mode: min
      save_top_k: 1                          # best checkpoint
      save_last: true                      # plus a copy of the final epoch
      auto_insert_metric_name: false       # keep filename clean
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "MNIST-Autoencoder"
      log_model: true

model:
  class_path: training.lit_autoencoder.LitAutoencoder
  init_args:
    model:
      class_path: models.ae_channels.ConvAutoencoder
      init_args:
        latent_dim: 3
    
    initial_lr: 5e-3
    final_lr: 5e-6
    warmup_steps: 1000
    weight_decay: 1e-5

    beta: 0.01
    
    
    

data:
  class_path: training.datamodules.mnist.MNISTDataModule
  init_args:
    data_dir: data/
    batch_size: 64
    val_size: 5000
    num_workers: 4
    augment: true
