trainer:
  max_epochs: 100
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/german_credit_classifier/
      filename: "best"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: false
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "German-Credit-Classifier"
      log_model: true

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.TabularClassifier
      init_args:
        # Column order: duration, credit_amount, installment_rate, present_residence,
        #               age, num_credits, num_liable,
        #               status, credit_history, purpose, savings, employment,
        #               personal_status, other_debtors, property,
        #               other_installment_plans, housing, job, telephone, foreign_worker
        input_types:
          - numerical    # duration
          - numerical    # credit_amount
          - numerical    # installment_rate
          - numerical    # present_residence
          - numerical    # age
          - numerical    # num_credits
          - numerical    # num_liable
          - categorical  # status
          - categorical  # credit_history
          - categorical  # purpose
          - categorical  # savings
          - categorical  # employment
          - categorical  # personal_status
          - categorical  # other_debtors
          - categorical  # property
          - categorical  # other_installment_plans
          - categorical  # housing
          - categorical  # job
          - categorical  # telephone
          - categorical  # foreign_worker
        cardinalities: [4, 5, 10, 5, 5, 4, 3, 4, 3, 3, 4, 2, 2]
        hidden_dims: [64, 32]
        num_classes: 2
        dropout: 0.2

    initial_lr: 5e-3
    final_lr: 1e-6
    weight_decay: 1e-4

data:
  class_path: training.datamodules.german_credit.GermanCreditDataModule
  init_args:
    filepath: data/GermanCredit/raw.parquet
    batch_size: 128
    val_fraction: 0.1
    test_fraction: 0.1
    seed: 42
    num_workers: 4
