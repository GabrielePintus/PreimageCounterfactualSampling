trainer:
  max_epochs: 100
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/lending_club_classifier/
      filename: "best"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: false
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: lightning_logs
      name: lending_club_classifier

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.TabularClassifier
      init_args:
        # Column order: loan_amnt, int_rate, annual_inc, dti,
        #               delinq_2yrs, open_acc, pub_rec, revol_util,
        #               term, grade, home_ownership, verification_status
        input_types:
          - numerical    # loan_amnt
          - numerical    # int_rate
          - numerical    # annual_inc
          - numerical    # dti
          - numerical    # delinq_2yrs
          - numerical    # open_acc
          - numerical    # pub_rec
          - numerical    # revol_util
          - categorical  # term
          - categorical  # grade
          - categorical  # home_ownership
          - categorical  # verification_status
        cardinalities: [2, 7, 5, 3]  # term (2), grade (7), home_ownership (5), verification_status (3)
        hidden_dims: [64, 32]
        num_classes: 2
        dropout: 0.2

    initial_lr: 5e-3
    final_lr: 1e-6
    weight_decay: 1e-4

data:
  class_path: training.datamodules.lending_club.LendingClubDataModule
  init_args:
    filepath: data/LendingClub/raw.parquet
    batch_size: 128
    val_fraction: 0.1
    test_fraction: 0.1
    seed: 42
    num_workers: 4
