trainer:
  max_epochs: 50
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/lending_club_classifier/
      filename: "LendingClub-Classifier-{epoch:03d}-{val/loss:.4f}"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: true
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "LendingClub-Classifier"
      log_model: true

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.TabularClassifier
      init_args:
        # Column order: loan_amnt, int_rate, annual_inc, dti,
        #               delinq_2yrs, open_acc, pub_rec, revol_util,
        #               term, grade, home_ownership, verification_status
        input_types:
          - numerical    # loan_amnt
          - numerical    # int_rate
          - numerical    # annual_inc
          - numerical    # dti
          - numerical    # delinq_2yrs
          - numerical    # open_acc
          - numerical    # pub_rec
          - numerical    # revol_util
          - categorical  # term
          - categorical  # grade
          - categorical  # home_ownership
          - categorical  # verification_status
        cardinalities: [2, 7, 5, 3]  # term (2), grade (7), home_ownership (5), verification_status (3)
        hidden_dims: [128, 32]
        num_classes: 2
        dropout: 0.1

    initial_lr: 1e-3
    final_lr: 1e-6
    weight_decay: 1e-4
    warmup_steps: 200
    # Inverse-frequency weights from the current train split (26301 vs 4522),
    # normalized to keep the average weight near 1.
    class_weights: [0.586, 3.408]

data:
  class_path: training.datamodules.lending_club.LendingClubDataModule
  init_args:
    filepath: data/LendingClub/raw.parquet
    batch_size: 64
    val_fraction: 0.1
    test_fraction: 0.1
    seed: 42
    num_workers: 4
