trainer:
  max_epochs: 100
  accelerator: auto
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/adult_classifier/
      filename: "best"
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: false
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "CertifiedCounterfactuals"
      name: "Adult-Classifier"
      log_model: true

model:
  class_path: training.lit_classifier.LitClassifier
  init_args:
    model:
      class_path: models.classifiers.TabularClassifier
      init_args:
        # Column order: age, workclass, fnlwgt, education, education-num, marital-status,
        #               occupation, relationship, race, sex, capital-gain, capital-loss,
        #               hours-per-week, native-country
        input_types:
          - numerical    # age
          - categorical  # workclass
          - numerical    # fnlwgt
          - categorical  # education
          - numerical    # education-num
          - categorical  # marital-status
          - categorical  # occupation
          - categorical  # relationship
          - categorical  # race
          - categorical  # sex
          - numerical    # capital-gain
          - numerical    # capital-loss
          - numerical    # hours-per-week
          - categorical  # native-country
        cardinalities: [7, 16, 7, 14, 6, 5, 2, 41]  # per categorical column, in order
        hidden_dims: [64, 32]
        num_classes: 2
        dropout: 0.2

    initial_lr: 5e-3
    final_lr: 1e-6
    weight_decay: 1e-4

data:
  class_path: training.datamodules.adult.AdultDataModule
  init_args:
    filepath: data/Adult/raw.parquet
    batch_size: 128
    val_fraction: 0.1
    test_fraction: 0.1
    seed: 42
    num_workers: 4
    pca_enabled: false
    pca_n_components: 0.99
    pca_svd_solver: full
    pca_whiten: false
    pca_random_state: 42
